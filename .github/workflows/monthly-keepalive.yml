name: Aylık keepalive commit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 1 * *" # Her ayın 1'inde UTC 02:00'da

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repo'yu checkout et
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Boş commit oluştur
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: monthly keepalive"

      - name: Commit'i push et
        run: git push

