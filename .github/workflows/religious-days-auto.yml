name: Dini Günler (Otomatik)

on:
  schedule:
    - cron: "0 0 1 1 *" # Her 1 Ocak 00:00 UTC
  workflow_dispatch:
    inputs:
      years:
        description: "Virgülle ayrılmış yıllar (boş ise otomatik mod: eksik olan en güncel yıl)"
        required: false
        default: ""

jobs:
  fetch-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Fetch religious days
        env:
          STORAGE_KEY: ${{ secrets.STORAGE_KEY }}
        run: |
          YEARS_INPUT="${{ github.event.inputs.years }}"
          if [ -n "$YEARS_INPUT" ]; then
            npm run fetch-religious-days -- --years="$YEARS_INPUT"
          else
            npm run fetch-religious-days-auto
          fi

