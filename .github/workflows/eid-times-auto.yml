name: Bayram Namazı Vakitleri (Aylık)

on:
  schedule:
    - cron: "0 3 1 * *" # Her ayın 1'i saat 03:00 UTC
  workflow_dispatch:

jobs:
  fetch-eid-times:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Fetch eid prayer times (all cities)
        env:
          OCI_ACCESS_KEY: ${{ secrets.OCI_ACCESS_KEY }}
          OCI_SECRET_KEY: ${{ secrets.OCI_SECRET_KEY }}
          OCI_NAMESPACE: ax4vnct8ysku
          OCI_REGION: me-jeddah-1
          OCI_BUCKET_NAME: namazvaktimdepo
        run: |
          npm run fetch-eid-times
