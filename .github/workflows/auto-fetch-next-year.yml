name: Auto Fetch Next Year Prayer Times

on:
  # 3 Aralık'tan başlayarak 3 günde bir Oracle OS'de gelecek yıl verisi var mı kontrol et
  # 1 Aralık'ta fetch-prayer-times zaten otomatik çalışıyor, bu workflow onun sonucunu kontrol eder
  schedule:
    - cron: '0 0 3 12 *'   # 3 Aralık 00:00 UTC
    - cron: '0 0 6 12 *'   # 6 Aralık 00:00 UTC
    - cron: '0 0 9 12 *'   # 9 Aralık 00:00 UTC
    - cron: '0 0 12 12 *'  # 12 Aralık 00:00 UTC
    - cron: '0 0 15 12 *'  # 15 Aralık 00:00 UTC
    - cron: '0 0 18 12 *'  # 18 Aralık 00:00 UTC
    - cron: '0 0 21 12 *'  # 21 Aralık 00:00 UTC
    - cron: '0 0 24 12 *'  # 24 Aralık 00:00 UTC
    - cron: '0 0 27 12 *'  # 27 Aralık 00:00 UTC
    - cron: '0 0 30 12 *'  # 30 Aralık 00:00 UTC (son şans)

  # Manuel tetikleme (acil durumlar için)
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Oracle OS kontrolünü atlayıp direkt fetch-prayer-times tetikle'
        required: false
        default: false
        type: boolean

permissions:
  actions: write

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    env:
      STORAGE_KEY: ${{ secrets.STORAGE_KEY }}
      NODE_ENV: production

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Get next year
      id: year
      run: echo "NEXT_YEAR=$(($(date +%Y) + 1))" >> $GITHUB_OUTPUT

    - name: Log start information
      run: |
        echo "🔍 Gelecek yıl namaz vakti kontrol işlemi başlatılıyor..."
        echo "📅 Bugün: $(date)"
        echo "📊 Hedef yıl: ${{ steps.year.outputs.NEXT_YEAR }}"

    - name: Check if data exists in Oracle OS
      id: check_gcs
      if: github.event.inputs.force_run != 'true'
      run: |
        echo "☁️  Oracle OS'de ${{ steps.year.outputs.NEXT_YEAR }} yılı verileri var mı kontrol ediliyor..."

        SUMMARY_EXISTS=$(node -e "
          const Oracle OSService = require('./src/services/gcsService');
          const gcs = new Oracle OSService();
          gcs.fileExists('summary-${{ steps.year.outputs.NEXT_YEAR }}.json')
            .then(exists => console.log(exists ? 'EXISTS' : 'NOT_EXISTS'))
            .catch(() => console.log('NOT_EXISTS'));
        " 2>/dev/null || echo "NOT_EXISTS")

        if [ "$SUMMARY_EXISTS" = "EXISTS" ]; then
          echo "✅ ${{ steps.year.outputs.NEXT_YEAR }} yılı verileri zaten Oracle OS'de mevcut!"
          echo "DATA_EXISTS=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Oracle OS'de ${{ steps.year.outputs.NEXT_YEAR }} yılı verisi bulunamadı."
          echo "DATA_EXISTS=false" >> $GITHUB_OUTPUT
        fi

    - name: Trigger fetch-prayer-times workflow
      if: steps.check_gcs.outputs.DATA_EXISTS == 'false' || github.event.inputs.force_run == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        NEXT_YEAR=${{ steps.year.outputs.NEXT_YEAR }}
        echo "🚀 fetch-prayer-times workflow tetikleniyor ($NEXT_YEAR yılı için)..."

        gh workflow run fetch-prayer-times.yml \
          -f year="$NEXT_YEAR" \
          -f workers="20" \
          -f turkey_only="false"

        echo "✅ Workflow tetiklendi! İşlem arka planda devam edecek."
        echo "📋 Takip: https://github.com/${{ github.repository }}/actions/workflows/fetch-prayer-times.yml"

    - name: Skip - Data already exists
      if: steps.check_gcs.outputs.DATA_EXISTS == 'true'
      run: |
        echo "✅ ${{ steps.year.outputs.NEXT_YEAR }} yılı verileri zaten Oracle OS'de mevcut!"
        echo "📁 Tekrar indirme gerekmiyor."

    - name: Notify failure
      if: failure()
      run: |
        echo "❌ HATA! ${{ steps.year.outputs.NEXT_YEAR }} yılı kontrol/tetikleme işlemi başarısız!"
        echo "📅 Hata tarihi: $(date)"
        echo "🔍 Loglara bakın: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "⚠️  Manuel olarak 'Namaz Vakitleri Al (Paralel)' workflow'unu çalıştırın"
