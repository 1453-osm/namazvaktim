name: Dini Günler (Manuel)

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Virgülle ayrılmış yıllar (opsiyonel, boş ise -1/0/+1/+2)"
        required: false
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Fetch & upload
        env:
          GCS_SERVICE_ACCOUNT_KEY: ${{ secrets.GCS_SERVICE_ACCOUNT_KEY }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
        run: |
          YEARS_INPUT="${{ github.event.inputs.years }}"
          if [ -n "$YEARS_INPUT" ]; then
            npm run fetch-religious-days -- --years="$YEARS_INPUT"
          else
            npm run fetch-religious-days
          fi

